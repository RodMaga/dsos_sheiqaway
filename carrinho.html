<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sheiqaway - Carrinho</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <button type="button" id="logo-button" class="header-logo-button">
            <h1>sheiqaway</h1>
        </button>
        <nav>
            <a href="index.html">Viajar</a>
            <a href="carrinho.html" id="cart-link" class="current-page">Carrinho (0)</a>
            <div id="auth-section">
                <a href="login.html" id="login-link">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="content-card cart-box">
            <h2>O meu carrinho</h2>
            <div class="cart-container">
                
                <div class="cart-items">
                    <div id="cart-items-container">
                        <p>O seu carrinho está vazio.</p>
                    </div>
                </div>

                <div class="cart-summary">
                    <h4>Sumário da Compra</h4>
                    <div class="summary-line">
                        <span>Subtotal:</span>
                        <span id="cart-subtotal">€ 0.00</span>
                    </div>
                    <div class="summary-line">
                        <span>Taxas e Impostos:</span>
                        <span id="cart-taxes">€ 0.00</span>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                    <div class="summary-line summary-total">
                        <strong>Total:</strong>
                        <strong id="cart-total">€ 0.00</strong>
                    </div>
                    <button class="checkout-button">Finalizar Compra</button>
                    <a href="index.html" class="back-link">Continuar a pesquisar</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 sheiqaway. Trabalho Prático DSOS.</p>
    </footer>

    <script src="js/global.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
