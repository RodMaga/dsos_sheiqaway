<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>sheiqaway - O Meu Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/global.js"></script>
</head>
<body>
    <header>
        <button type="button" id="logo-button" class="header-logo-button"><h1>sheiqaway</h1></button>
        <nav id="nav-menu"></nav>
    </header>

    <main>
        <div class="profile-layout" style="display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1200px; margin: 30px auto; padding: 0 20px;">
            <aside class="content-card">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="width: 80px; height: 80px; background: var(--primary-color); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2em;" id="user-initial">U</div>
                    <h3 id="user-name-display">Utilizador</h3>
                    <p id="user-email-display" style="color: var(--text-secondary); font-size: 0.9em;"></p>
                </div>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
                <button onclick="logout()" class="remove-btn" style="width: 100%; text-align: center;">Terminar Sessão</button>
            </aside>

            <section class="content-card">
                <h2>As Minhas Reservas</h2>
                <div id="history-container" style="margin-top: 20px;">
                    </div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) { window.location.href = 'login.html'; return; }

            // Atualizar dados da Sidebar
            document.getElementById('user-name-display').textContent = user.name;
            document.getElementById('user-email-display').textContent = user.name + "@exemplo.com";
            document.getElementById('user-initial').textContent = user.name.charAt(0).toUpperCase();

            // Carregar Histórico
            const history = JSON.parse(localStorage.getItem('purchaseHistory')) || [];
            const container = document.getElementById('history-container');

            if (history.length === 0) {
                container.innerHTML = '<p>Ainda não efetuou nenhuma reserva.</p>';
            } else {
                history.forEach(reserva => {
                    container.innerHTML += `
                        <div style="padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong>${reserva.from} ➔ ${reserva.to}</strong><br>
                                <small style="color: var(--text-secondary)">Data: ${reserva.date} | Bilhete: ${reserva.ticketCode}</small>
                            </div>
                            <span style="color: #28a745; font-weight: bold;">Confirmado</span>
                        </div>
                    `;
                });
            }
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
        document.getElementById('logo-button').onclick = () => window.location.href = 'index.html';
    </script>
</body>
</html>
