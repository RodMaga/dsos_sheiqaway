<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>sheiqaway - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <button type="button" id="logo-button" class="header-logo-button"><h1>sheiqaway</h1></button>
    </header>
    <main>
        <div class="content-card" style="max-width: 400px; margin: 80px auto; text-align: center;">
            <h2 style="margin-bottom: 20px;">Bem-vindo de volta</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="E-mail" required style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px;">
                <input type="password" id="pass" placeholder="Palavra-passe" required style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:5px;">
                <button type="submit" class="search-button" style="width: 100%;">Entrar</button>
            </form>
            <p style="margin-top: 15px; font-size: 0.9em; color: #666;">Dica: Use qualquer e-mail para testar.</p>
        </div>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = { name: document.getElementById('email').value.split('@')[0], loggedIn: true };
            localStorage.setItem('user', JSON.stringify(user));
            window.location.href = 'index.html';
        });
        document.getElementById('logo-button').onclick = () => window.location.href = 'index.html';
    </script>
</body>
</html>
